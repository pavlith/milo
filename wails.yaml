# yaml-language-server: $schema=https://v3.wails.io/schemas/wails.v3.json
version: 3
project:
  name: milo
  product_name: Milo
  identifier: io.github.pavlith.milo.platform
  version: 0.0.1
linux:
  desktop_entry: build/linux/io.github.pavlith.milo.platform.desktop
frontend:
  directory: frontend
  install: [pnpm, install, --frozen-lockfile]
  build: [pnpm, build]
  dev: [pnpm, dev]
  output: frontend/dist
  bindings:
    typescript: true
    interfaces: true
    output: bindings
build:
  output: bin
